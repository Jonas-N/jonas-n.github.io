# Personal academic homepage.
# Edit the values here rather than hard-coding them in pages or layouts.
# Publications, talks, news, positions, and education live in _data/.

title: "Jonas Nölle"
tagline: "Language evolution, multimodal communication and virtual reality"
description: >-
  Jonas Nölle is a cognitive scientist at the Centre for Language Evolution
  Studies, Nicolaus Copernicus University in Toruń, and an affiliate researcher
  at the University of Glasgow. He studies how communicative signals (words,
  gestures and facial movements) adapt to the people and environments they are
  used in, using interactive experiments, virtual reality and data-driven
  models of facial behaviour.
updated: "October 2026"

