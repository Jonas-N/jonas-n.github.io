# Newest first. The home page shows the first seven.
# text is Markdown, so links and *italics* work.
- date: Coming up
  text: >-
    Invited talk in the Department of Experimental Psychology, University of
    Oxford.
- date: September 2026
  text: >-
    Yichen Wu defended his PhD in Psychology at the University of Glasgow.
    I co-supervised the thesis with Rachael Jack. Congratulations, Dr Wu!
- date: 2026
  text: >-
    *Dynamic facial movements shape how confident speakers appear* is out in
    [*Proceedings of the Royal Society B*](https://royalsocietypublishing.org/rspb/article/293/2081/20262044/483770/Dynamic-facial-movements-shape-how-confident).
    Upper-face movements change whether listeners hear a speaker as confident
    or doubtful, in much the same way for British English and Mandarin Chinese
    listeners.
- date: 2026
  text: >-
    New in [*Cognition*](https://doi.org/10.1016/j.cognition.2026.106736), with
    colleagues in Toruń: how the way people are positioned relative to each
    other shapes the bodily communication systems they invent.
- date: April 2026
  text: >-
    Four papers at [EVOLANG XVI](https://evolang.org/2026/proceedings/) in
    Plovdiv, on spatial biases in new communication systems, pantomime and
    motion capture, folk dance as a semiotic system, and a field-based model of
    value exchange in interaction. I also co-edited the
    [proceedings](https://doi.org/10.17617/2.3696655).
- date: 2026
  text: >-
    *When the city speaks*, a virtual reality study of how urban layout shapes
    spatial language over six simulated generations, is out in
    [*Open Mind*](https://doi.org/10.1162/OPMI.a.380).
- date: 2026
  text: >-
    Invited talk at the Max Planck Institute for Evolutionary Anthropology,
    Leipzig.
- date: 2025
  text: >-
    Co-organised the conference of the International Society for Gesture
    Studies (ISGS 2025) in Nijmegen.
- date: May 2025
  text: >-
    Joined the [Centre for Language Evolution Studies](https://cles.umk.pl/) at
    Nicolaus Copernicus University in Toruń as a postdoctoral researcher.
